# =========================================================================
# Docker Compose configuration: Task Manager stack
# -------------------------------------------------------------------------
# Stack overview:
#   mongodb        -> database
#   mongo-express  -> web UI for the database      (http://localhost:8081)
#   backend        -> FastAPI API                  (http://localhost:8000)
#   frontend       -> React app served by Nginx    (http://localhost:3000)
#   cadvisor       -> container metrics collector  (http://localhost:8082)
#   prometheus     -> metrics storage / scraping   (http://localhost:9090)
#   grafana        -> dashboards                   (http://localhost:3001)
#
# Start everything:  docker compose up -d --build
# Stop everything:   docker compose down        (add -v to delete volumes/data)
# =========================================================================
services:

  # -------------------------------------------------------
  # DATABASE: MongoDB
  # -------------------------------------------------------
  mongodb:
    # Official MongoDB 7.0 image (includes the 'mongosh' shell used by the healthcheck).
    image: mongo:7.0

    # Fixed container name so other tools and logs can find it easily.
    container_name: task_manager_db

    environment:
      # Root user created automatically on the FIRST start with an empty data volume.
      # Changing these later has no effect unless you delete the volume (docker compose down -v).
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password

    ports:
      # host:container. Lets tools on your computer (e.g. MongoDB Compass) connect.
      # Remove this mapping if nothing outside Docker needs direct DB access.
      - "27017:27017"

    volumes:
      # Named volume so data survives container removal and rebuilds.
      - mongo_data:/data/db

    # Docker runs this command repeatedly to decide if the container is "healthy".
    # Other services use 'condition: service_healthy' to wait for it.
    # This is a plain TCP check (is port 27017 accepting connections?). It is used instead of
    # 'mongosh' because starting mongosh took longer than 30s on a slow host and always timed out.
    # The real database connection is verified by the backend's /health endpoint.
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/27017'"]
      interval: 15s      # time between checks
      timeout: 10s       # a single check is failed if it takes longer than this
      retries: 10        # consecutive failures before the container is marked "unhealthy"
      start_period: 60s  # grace period on startup during which failures are not counted

    # Restart automatically after a crash or a Docker restart, unless you stopped it manually.
    restart: unless-stopped

  # -------------------------------------------------------
  # DATABASE WEB UI: Mongo Express
  # -------------------------------------------------------
  mongo-express:
    # Lightweight web admin interface for MongoDB. Version is pinned for reproducibility.
    image: mongo-express:1.0.2
    container_name: task_manager_mongo_ui

    environment:
      # Credentials Mongo Express uses to log in to MongoDB (must match the root user above).
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password

      # Hostname of the database = the service name 'mongodb' (Docker DNS resolves it).
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017

      # Database where the root user is defined.
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin

      # Browser login protecting the web UI itself (separate from the DB credentials).
      # Change the password before exposing this anywhere.
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: change-this-password

    ports:
      # Open http://localhost:8081 in your browser.
      - "8081:8081"

    # Wait until MongoDB reports healthy before starting this UI.
    depends_on:
      mongodb:
        condition: service_healthy

    restart: unless-stopped

  # -------------------------------------------------------
  # BACKEND: FastAPI
  # -------------------------------------------------------
  backend:
    # Build the image from the Dockerfile in ./Backend (note the capital B in the folder name).
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: task_manager_api

    ports:
      # API and Swagger docs: http://localhost:8000 and http://localhost:8000/docs
      - "8000:8000"

    environment:
      # Connection string. 'mongodb' is the service name, not 'localhost'.
      # authSource=admin because the root user lives in the admin database.
      MONGO_URI: "mongodb://root:password@mongodb:27017/task_manager?authSource=admin"
      # Name of the database the app uses inside MongoDB.
      DATABASE_NAME: task_manager

    # Do not start the API until MongoDB is healthy.
    depends_on:
      mongodb:
        condition: service_healthy

    # Command that starts the API server.
    # --host 0.0.0.0 makes it reachable from outside the container.
    command: uvicorn main:app --host 0.0.0.0 --port 8000

    # Calls the API's own /health endpoint (returns 503 if MongoDB is unreachable).
    # The frontend waits for this check to pass.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 30s       # time between checks
      timeout: 30s        # max time allowed for one check
      retries: 10         # failures allowed before "unhealthy"
      start_period: 60s   # startup grace period

    restart: unless-stopped

  # -------------------------------------------------------
  # FRONTEND: React served by Nginx
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Backend address as seen from the BROWSER (so localhost, not the service name).
        # Create React App bakes this into the bundle at build time. If you change it,
        # rebuild the image: docker compose up -d --build frontend
        REACT_APP_API_URL: "http://localhost:8000"

    container_name: task_manager_frontend

    ports:
      # host 3000 -> Nginx listening on 8080 inside the container.
      # The browser origin http://localhost:3000 must be in the backend's CORS allow list.
      - "3000:8080"

    # Start only after the backend reports healthy.
    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

  # -------------------------------------------------------
  # MONITORING: cAdvisor (container CPU / memory / network metrics)
  # -------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: task_manager_cadvisor
    command:
        - --housekeeping_interval=30s        # collect stats less often (default 1s)
        - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,process
      # --docker_only removed so we can see every cgroup while debugging
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro   # added: some hosts need this to read container cgroups
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped

  # -------------------------------------------------------
  # MONITORING: Prometheus (metrics storage and scraping)
  # -------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: task_manager_prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml   # config mounted below
      - --storage.tsdb.path=/prometheus                # where metric data is stored
      - --storage.tsdb.retention.time=15d              # keep 15 days of history

    ports:
      # Prometheus UI: http://localhost:9090 (check /targets to see scrape status)
      - "9090:9090"

    volumes:
      # Your scrape configuration, mounted read-only.
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Named volume so metrics survive restarts.
      - prometheus_data:/prometheus

    # Start order only (does not wait for cAdvisor to be healthy).
    depends_on:
      - cadvisor

    restart: unless-stopped

  # -------------------------------------------------------
  # MONITORING: Grafana (dashboards)
  # -------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: task_manager_grafana

    environment:
      # Initial admin login. Change the password before sharing this setup.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: change-this-password
      # Disable self-registration on the login page.
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      # 3000 on the host is already used by the frontend, so Grafana is on 3001.
      - "3001:3000"

    volumes:
      # Stores dashboards, users and settings.
      - grafana_data:/var/lib/grafana
      # Auto-configures the Prometheus data source at startup (datasources/datasource.yml).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

    restart: unless-stopped

  # -------------------------------------------------------
  # MONITORING: MongoDB exporter (turns MongoDB stats into Prometheus metrics)
  # -------------------------------------------------------
  mongodb-exporter:
    # Percona's exporter. MongoDB has no /metrics endpoint of its own, so this container
    # connects to the database and exposes the stats on port 9216 for Prometheus.
    # Check that this tag exists on Docker Hub if the pull fails.
    image: percona/mongodb_exporter:0.40
    container_name: task_manager_mongo_exporter

    command:
      # Connection string. 'mongodb' is the service name, and the credentials must match
      # MONGO_INITDB_ROOT_USERNAME / PASSWORD on the mongodb service.
      - --mongodb.uri=mongodb://root:[REDACTED]@mongodb:27017/admin
      # Collect all available metrics (database, collection, index and server stats).
      # This is the heaviest option. Remove it on a low-memory host to keep only the basics.
      - --collect-all

    # Wait for MongoDB to be healthy before connecting.
    depends_on:
      mongodb:
        condition: service_healthy

    # No 'ports:' needed. Prometheus reaches it inside the Docker network at mongodb-exporter:9216.
    # Add "9216:9216" only if you want to open http://localhost:9216/metrics in your browser.

    restart: unless-stopped


# -------------------------------------------------------
# PERSISTENT STORAGE
# -------------------------------------------------------
# Named volumes managed by Docker. They survive 'docker compose down';
# 'docker compose down -v' deletes them (and all data).
volumes:
  mongo_data:        # MongoDB data files
  prometheus_data:   # Prometheus time-series data
  grafana_data:      # Grafana dashboards and settings
