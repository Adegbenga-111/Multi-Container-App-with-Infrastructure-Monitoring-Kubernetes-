# MongoDB has no /metrics endpoint, so this exporter connects to the database and exposes
# its statistics for Prometheus. Three resources: Deployment, Service, ServiceMonitor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: task-manager
  labels:
    app: mongodb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
    spec:
      containers:
        - name: exporter
          # Check that this tag exists on Docker Hub if the pull fails.
          image: percona/mongodb_exporter:0.40
          args:
            # $(VAR) is replaced with the env values defined below.
            # 'mongodb-service' is the MongoDB Service name in service-mongo.yaml.
            - --mongodb.uri=mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@mongodb-service:27017/admin
            - --collect-all      # heaviest option. Remove it on a low-memory host to keep the basics only.
          env:
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-username
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-password
          ports:
            - name: metrics
              containerPort: 9216
          readinessProbe:
            tcpSocket:
              port: 9216
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter
  namespace: task-manager
  labels:
    app: mongodb-exporter      # the ServiceMonitor selects on this label
spec:
  selector:
    app: mongodb-exporter
  ports:
    - name: metrics            # the ServiceMonitor refers to this port name
      port: 9216
      targetPort: 9216
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mongodb-exporter
  namespace: task-manager
spec:
  selector:
    matchLabels:
      app: mongodb-exporter
  namespaceSelector:
    matchNames:
      - task-manager
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 20s