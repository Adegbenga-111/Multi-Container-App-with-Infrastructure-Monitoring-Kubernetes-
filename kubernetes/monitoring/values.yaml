# =========================================================================
# Helm values for kube-prometheus-stack (slim install for a laptop)
# Install:  helm install monitoring prometheus-community/kube-prometheus-stack \
#             -n monitoring --create-namespace -f kubernetes/monitoring/values.yaml
# =========================================================================

# Not needed for learning. Saves memory.
alertmanager:
  enabled: false

# node-exporter often fails on Docker Desktop (host mount problem) and is not needed
# for app monitoring. Node-level dashboards will be empty.
nodeExporter:
  enabled: false

# Control-plane components are not reachable on Docker Desktop, so their scrapes would
# only show as failing targets and noisy alerts.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  # Change this. Do not commit a real password to Git.
  adminPassword: change-me-grafana

prometheus:
  prometheusSpec:
    # Discover ServiceMonitors in ALL namespaces (including task-manager),
    # not only the ones labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    retention: 7d
    resources:
      requests:
        memory: 400Mi
        cpu: 100m