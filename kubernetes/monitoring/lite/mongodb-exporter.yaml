# MongoDB has no /metrics endpoint, so this exporter connects to the database and exposes
# its statistics on port 9216. The Prometheus job 'mongodb' in prometheus-values.yaml scrapes it.
# No ServiceMonitor here: the lightweight setup has no Prometheus Operator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: task-manager
  labels:
    app: mongodb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
    spec:
      containers:
        - name: exporter
          # Check that this tag exists on Docker Hub if the pull fails.
          image: percona/mongodb_exporter:0.40
          args:
            # $(VAR) is replaced with the env values defined below.
            # 'mongodb-service' is the MongoDB Service name in service-mongo.yaml.
            - --mongodb.uri=mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@mongodb-service:27017/admin
            - --collect-all      # remove this line to collect only the basics and use less memory
          env:
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-username
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-password
          ports:
            - name: metrics
              containerPort: 9216
          readinessProbe:
            tcpSocket:
              port: 9216
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter       # the Prometheus job targets mongodb-exporter.task-manager.svc.cluster.local:9216
  namespace: task-manager
  labels:
    app: mongodb-exporter
spec:
  selector:
    app: mongodb-exporter
  ports:
    - name: metrics
      port: 9216
      targetPort: 9216