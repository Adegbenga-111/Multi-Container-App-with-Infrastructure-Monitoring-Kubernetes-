# Tells Prometheus to scrape the FastAPI backend's /metrics endpoint.
# Requires: the ServiceMonitor CRD (installed by kube-prometheus-stack) and a Service that has
# the label app=backend and a NAMED port 'http' (see kubernetes/service-backend.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: task-manager
spec:
  selector:
    matchLabels:
      app: backend             # matches the label on backend-service (not on the pods)
  namespaceSelector:
    matchNames:
      - task-manager
  endpoints:
    - port: http               # the port NAME in service-backend.yaml
      path: /metrics
      interval: 30s
      scrapeTimeout: 20s