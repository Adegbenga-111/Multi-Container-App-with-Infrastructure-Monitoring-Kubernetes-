apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: Task Manager
spec:
  type: ClusterIP            # Default type (can be omitted)
  selector:
    app: frontend         # Matches the Pod label from the deployment above
  ports:
    - protocol: TCP
      port: 80          # Port exposed INSIDE the cluster (e.g., http://frontend-service:80)
      targetPort: 8080  