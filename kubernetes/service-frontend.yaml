apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: task-manager
spec:
  type: ClusterIP
  selector:
    app: frontend            # matches the pod label in deployment-frontend.yaml
  ports:
    - protocol: TCP
      port: 80               # port inside the cluster
      targetPort: 8080       # port Nginx listens on in the container
