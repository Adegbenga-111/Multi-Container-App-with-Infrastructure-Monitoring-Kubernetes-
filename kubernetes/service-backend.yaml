apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: task-manager
spec:
  type: ClusterIP
  selector:
    app: backend             # matches the pod label in deployment-backend.yaml
  ports:
    - name: http                # a NAME is required for ServiceMonitor to select the port
      protocol: TCP
      port: 8000             # port inside the cluster (http://backend-service:8000)
      targetPort: 8000
