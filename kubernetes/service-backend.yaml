apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: Task Manager
spec:
  type: ClusterIP            # Default type (can be omitted)
  selector:
    app: backend         # Matches the Pod label from the deployment above
  ports:
    - protocol: TCP
      port: 8000        # Port exposed INSIDE the cluster (e.g., http://backend-service:8000
      targetPort: 8000  