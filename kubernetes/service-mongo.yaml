apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: Task Manager
spec:
  type: ClusterIP            # Default type (can be omitted)
  selector:
    app: mongodb         # Matches the Pod label from the deployment above
  ports:
    - protocol: TCP
      port: 27017          # Port exposed INSIDE the cluster (e.g., http://mongodb-service:27017)
      targetPort: 27017  