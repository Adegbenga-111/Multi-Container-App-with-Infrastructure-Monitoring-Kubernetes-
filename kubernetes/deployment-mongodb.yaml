apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-mongodb
  namespace: task-manager
spec:
  replicas: 1                # Must stay 1 because ReadWriteOnce storage cannot be shared
  strategy:
    type: Recreate           # Stop the old pod before starting a new one, so two pods never share the volume
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            # Key names must match the keys in secret.yaml exactly.
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-password
          volumeMounts:
            - name: data
              mountPath: /data/db
          # Probes replace the Compose 'healthcheck'. A TCP check is light enough for a slow host.
          readinessProbe:            # ready for traffic?
            tcpSocket:
              port: 27017
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:             # still alive? (container restarts if this keeps failing)
            tcpSocket:
              port: 27017
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-pvc   # must match the PVC name in pvc.yaml
